<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="分域代理">
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="url(#g4)"/>

  <!-- 左侧：一个"域"的符号——三条横线叠成的小卡片（代表站点） -->
  <g stroke="#ffffff" stroke-width="2.7" stroke-linecap="round">
    <rect x="9.5" y="15" width="12" height="18" rx="2.6" fill="none"/>
    <path d="M12.5 20.5h6M12.5 24h6M12.5 27.5h4"/>
  </g>

  <!-- 中间：分流点 -->
  <circle cx="26.5" cy="24" r="2.2" fill="#ffffff"/>

  <!-- 右侧两条去向，一条实一条虚 -->
  <path d="M28.7 24h4.5c3 0 2.5-6.5 5.8-6.5" fill="none" stroke="#ffffff"
        stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28.7 24h4.5c3 0 2.5 6.5 5.8 6.5" fill="none" stroke="#ffffff"
        stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="2.6 3.2"/>
  <circle cx="39.6" cy="17.5" r="2.1" fill="#ffffff"/>
  <circle cx="39.6" cy="30.5" r="2.1" fill="none" stroke="#ffffff" stroke-width="2.2"/>
</svg>
