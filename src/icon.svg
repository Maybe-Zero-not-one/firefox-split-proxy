<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="分域代理">
  <defs>
    <linearGradient id="amo-bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <!-- 圆角底 -->
  <rect width="48" height="48" rx="11" fill="url(#amo-bg)"/>

  <!-- 左：一个站点（"域"）—— 卡片 + 三条内容线 -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="14.5" width="13" height="19" rx="3" stroke-width="2.7"/>
    <path d="M12.6 20.2h5.8M12.6 24h5.8M12.6 27.8h3.6" stroke-width="2.15"/>
  </g>

  <!-- 中：分流点 -->
  <circle cx="26.6" cy="24" r="2.3" fill="#ffffff"/>

  <!-- 右：两条去向 —— 上面实线到实心点，下面虚线到空心环 -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28.9 24h4.1c2.9 0 2.4-6.6 5.6-6.6" stroke-width="2.7"/>
    <path d="M28.9 24h4.1c2.9 0 2.4 6.6 5.6 6.6" stroke-width="2.7" stroke-dasharray="2.7 3.3"/>
  </g>
  <circle cx="39.4" cy="17.4" r="2.15" fill="#ffffff"/>
  <circle cx="39.4" cy="30.6" r="2.15" fill="none" stroke="#ffffff" stroke-width="2.25"/>
</svg>
